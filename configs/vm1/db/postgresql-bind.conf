# Cấu hình PostgreSQL chỉ lắng nghe trên localhost (TV3).
# Trên Ubuntu 22.04 (PostgreSQL 14), copy vào /etc/postgresql/14/main/conf.d/99-localhost.conf
# rồi chạy: sudo systemctl restart postgresql
# Kiểm chứng: ss -tlpn | grep 5432  -> chỉ thấy 127.0.0.1:5432

listen_addresses = '127.0.0.1'
port = 5432
password_encryption = 'scram-sha-256'
