# Cấu hình xác thực PostgreSQL 14 trên Ubuntu 22.04 (TV3).
# Đặt tại /etc/postgresql/14/main/pg_hba.conf rồi restart postgresql.
# Chỉ cho phép local Unix socket (peer) và TCP loopback (127.0.0.1/32, ::1/128) cho webappdb/webapp_user; chặn toàn bộ kết nối từ bên ngoài.

# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             postgres                                peer
local   all             all                                     peer
host    webappdb        webapp_user     127.0.0.1/32            scram-sha-256
host    webappdb        webapp_user     ::1/128                 scram-sha-256
