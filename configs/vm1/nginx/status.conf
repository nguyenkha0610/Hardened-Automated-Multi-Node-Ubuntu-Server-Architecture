# vhost 2: trang trạng thái tĩnh (/var/www/status/index.html)
server {
    listen 80;
    server_name status.lab.local;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name status.lab.local;
    include snippets/self-signed.conf;
    root /var/www/status;
    index index.html;
}
